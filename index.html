      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is the Raptor programming language?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Raptor is a high-performance, post-LLM dynamic programming language designed as the pure dynamic Perl 5 subset of Raku targeting MoarVM. It features high token density, zero OOP boilerplate, continuous predicate invariant enforcement on every assignment, C-ABI structs, Uniform Function Call Syntax (UFCS), and Knuth-style PodLit literate programming."
            }
          },
          {
            "@type": "Question",
            "name": "What are continuous invariant predicates in Raptor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In Raptor, variables and dynamic subsets hold 'where' boolean predicates that are continuously evaluated on every mutation and assignment. If an assignment produces an invalid state, it is immediately caught at runtime at the exact point of mutation."
            }
          },
          {
            "@type": "Question",
            "name": "How does Raptor run in the web browser?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Raptor compiles directly into a standalone WebAssembly (WASM) binary that executes 100% client-side without any server-side dependencies. It provides direct hardware integration with HTML5 Canvas 2D rendering, WebAudio waveform synthesis, and dynamic DOM manipulation."
            }
          },
          {
            "@type": "Question",
            "name": "What is PodLit literate programming in Raptor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PodLit is Raptor's built-in Literate Programming subsystem grounded in Johan Hidding's IEEE e-Science 2023 research on bi-directional literate programming (Entangled). It supports weaving Markdown documentation, tangling source code chunks, and reverse-stitching modified code back into literate documents."
            }
          }
        ]
      }
    ]
  }

    <!-- HORIZONTAL GUTTER RESIZER (Drag left/right) -->
    <div id="resizerH" class="gutter-resizer-h" title="Drag to resize narrative and editor panes"></div>

    <!-- RIGHT PANE: Interactive Editor & Viewport -->
    <section class="tour-interactive-pane" id="interactivePane">
      
      <!-- Top File & Option Bar (#e0ebf5) -->
      <div class="editor-top-bar">
        <div class="editor-tab-active">
          <span>main.rp</span>
        </div>
      </div>

      <!-- Editor Textarea Area (#ffffea) with Line Numbers -->

      </div>

      <!-- VERTICAL GUTTER RESIZER (Drag up/down) -->
      <div id="resizerV" class="gutter-resizer-v" title="Drag to resize editor and output viewports"></div>

      <!-- Bottom Action Bar (#e0ebf5) with Reset and Run -->
      <div class="editor-bottom-bar">
        <div class="output-tab-links">
          <button id="tabConsole" class="view-switch-btn active">Output</button>
          <button id="tabCanvas" class="view-switch-btn">Canvas 2D</button>
          <button id="tabWebGL" class="view-switch-btn">WebGL 3D</button>
          <button id="tabDom" class="view-switch-btn">Live DOM</button>
        </div>

        <div class="editor-action-buttons">
          <button id="btnResetCode" class="action-btn-gray">Reset</button>
          <button id="btnRun" class="action-btn-blue">Run</button>
        </div>
      </div>

      <!-- Output Viewports Area -->
      <div class="tour-output-area" id="outputArea">
        
        <!-- Viewport 1: Terminal Console -->
        <div id="consoleView" class="output-view-pane active">
          <div id="consoleTerminal" class="output-terminal-text"></div>
          <div class="repl-bottom-bar">
            <span class="repl-prompt-symbol">&gt;</span>
            <input type="text" id="replInput" class="repl-inline-input" placeholder="Type inline Raptor code (e.g. 42.sqrt();) and press Enter..." autocomplete="off" spellcheck="false">
            <button id="btnClearConsole" class="repl-clear-btn">Clear</button>
          </div>
        </div>

        <!-- Viewport 2: Canvas 2D Stage (640x320) -->
        <div id="canvasView" class="output-view-pane">
          <div class="canvas-center-wrapper">
            <canvas id="wasmCanvas" width="640" height="320"></canvas>
          </div>
        </div>

        <!-- Viewport 3: WebGL 3D Hardware Stage (640x320) -->
        <div id="webglView" class="output-view-pane">
          <div class="canvas-center-wrapper">
            <canvas id="wasmWebGLCanvas" width="640" height="320"></canvas>
          </div>
        </div>

        <!-- Viewport 4: Live DOM Inspector -->
        <div id="domView" class="output-view-pane">
          <div class="dom-preview-wrapper">
            <div id="wasmDomContainer">
              <p class="dom-hint-text">DOM output from <code>dom_set_html()</code> will be rendered here dynamically.</p>
            </div>
          </div>
        </div>

      </div>

    </section>
